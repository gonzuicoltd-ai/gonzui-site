                pos[idx + 2] = z;
                color.setHSL((0.58 - brightness * 0.35 + state.levels.bass * 0.08) % 1, 0.78, 0.23 + brightness * 0.58);
                colArr[idx] = color.r;
                colArr[idx + 1] = color.g;
                colArr[idx + 2] = color.b;
              }
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
            material.size = config.particleSize * (1.05 + state.levels.treble * 1.55);
            glowMaterial.size = config.particleSize * (4.8 + state.levels.treble * 4.2);
            glowMaterial.opacity = clamp(0.2 + state.levels.overall * 0.44, 0.14, 0.64);
          }
        };
      }

      function scheduleParticleRebuild() {
        window.clearTimeout(state.rebuildTimer);
        state.rebuildTimer = window.setTimeout(function () {
          ["particles", "spiral", "emitter", "crown", "video"].forEach(function (id) {
            if (state.modes[id]) {
              rebuildMode(id);
            }
          });
          syncModes();
        }, 140);
      }

      function rebuildMode(id) {
        var mode = state.modes[id];
        if (!mode) {
          return;
        }
        disposeObject(mode.object);
        if (mode.object.parent) {
          mode.object.parent.remove(mode.object);
        }
        delete state.modes[id];
        if (config.enabledModes.indexOf(id) !== -1) {
          ensureMode(id);
        }
      }

      function updatePointSizes() {
        Object.keys(state.modes).forEach(function (id) {
          var mode = state.modes[id];
          mode.object.traverse(function (child) {
            if (child.material && child.material.isPointsMaterial) {
              child.material.size = config.particleSize;
            }
          });
        });
      }

      function disposeObject(object) {
        if (!object) {
          return;
        }
        object.traverse(function (child) {
          if (child.geometry) {
            child.geometry.dispose();
          }
          if (child.material) {
            if (Array.isArray(child.material)) {
              child.material.forEach(function (material) {
                material.dispose();
              });
            } else {
              child.material.dispose();
            }
          }
        });
      }

      async function ensureAudioContext() {
        if (!state.audioContext) {
          var AudioContextCtor = window.AudioContext || window.webkitAudioContext;
          state.audioContext = new AudioContextCtor();
          state.analyser = state.audioContext.createAnalyser();
          state.analyser.fftSize = 2048;
          state.analyser.smoothingTimeConstant = 0.84;
          state.outputGain = state.audioContext.createGain();
          state.outputGain.gain.value = 0;
          state.outputGain.connect(state.audioContext.destination);
          state.outputConnected = true;
          state.frequencyData = new Uint8Array(state.analyser.frequencyBinCount);
          state.waveformData = new Uint8Array(state.analyser.fftSize);
        }
        if (state.outputGain && !state.outputConnected) {
          state.outputGain.connect(state.audioContext.destination);
          state.outputConnected = true;
        }
        if (state.audioContext.state === "suspended") {
          await state.audioContext.resume();
        }
      }

      function connectAudioSource(source, monitorOutput, inputKind) {
        if (state.audioSource) {
          try {
            state.audioSource.disconnect();
          } catch (error) {
            // The node may already be disconnected after switching sources.
          }
        }
        try {
          state.analyser.disconnect();
        } catch (error) {
          // The analyser may not have an active output edge yet.
        }
        source.connect(state.analyser);
        state.analyser.connect(state.outputGain);
        if (monitorOutput) {
          state.outputGain.gain.setTargetAtTime(1, state.audioContext.currentTime, 0.015);
        } else {
          state.outputGain.gain.setTargetAtTime(0, state.audioContext.currentTime, 0.015);
        }
        state.audioSource = source;
        state.audioInputKind = inputKind || "unknown";
      }

      async function getMicrophoneStream() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("getUserMedia unavailable");
        }
        try {
          return await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            },
            video: false
          });
        } catch (error) {
          if (error && (error.name === "OverconstrainedError" || error.name === "ConstraintNotSatisfiedError" || error.name === "TypeError")) {
            return navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          }
          throw error;
        }
      }

      async function startMicrophone() {
        try {
          await ensureAudioContext();
          if (state.micStream) {
            state.micStream.getTracks().forEach(function (track) {
              track.stop();
            });
          }
          state.micStream = await getMicrophoneStream();
          connectAudioSource(state.audioContext.createMediaStreamSource(state.micStream), false, "mic");
          setStatus("Microphone", "Live audio analysis", "live");
        } catch (error) {
          setStatus("Microphone blocked", "Use HTTPS or localhost", "error");
        }
      }

      async function loadAudioFile(event) {
        var file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }
        try {
          await ensureAudioContext();
          var objectUrl = URL.createObjectURL(file);
          els.audioElement.src = objectUrl;
          els.audioElement.loop = true;
          els.audioElement.crossOrigin = "anonymous";
          if (!state.mediaElementSource) {
            state.mediaElementSource = state.audioContext.createMediaElementSource(els.audioElement);
          }
          connectAudioSource(state.mediaElementSource, true, "file");
          await els.audioElement.play();
          setStatus("Audio File", file.name, "live");
        } catch (error) {
          setStatus("Audio error", "The selected file could not play", "error");
        }
      }

      async function startWebcam() {
        try {
          if (state.videoStream) {
            state.videoStream.getTracks().forEach(function (track) {
              track.stop();
            });
          }
          state.videoStream = await navigator.mediaDevices.getUserMedia({
            video: {
              width: { ideal: config.videoWidth },
              height: { ideal: config.videoHeight }
            },
            audio: false
          });
          els.videoElement.srcObject = state.videoStream;
          els.videoElement.muted = true;
          els.videoElement.loop = false;
          await els.videoElement.play();
          state.videoReady = true;
          enableVideoMode();
          setStatus("Webcam", "Video depth input active", "live");
        } catch (error) {
          setStatus("Webcam blocked", "Use HTTPS or localhost", "error");
        }
      }

      async function loadVideoFile(event) {
        var file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }
        try {
          if (state.videoStream) {
            state.videoStream.getTracks().forEach(function (track) {
              track.stop();
            });
            state.videoStream = null;
          }
          els.videoElement.srcObject = null;
          els.videoElement.src = URL.createObjectURL(file);
          els.videoElement.muted = true;
          els.videoElement.loop = true;
          await els.videoElement.play();
          state.videoReady = true;
          enableVideoMode();
          setStatus("Video File", file.name, "live");
        } catch (error) {
          setStatus("Video error", "The selected file could not play", "error");
        }
      }

      function enableVideoMode() {
        if (config.enabledModes.indexOf("video") === -1) {
          config.enabledModes.push("video");
          document.querySelectorAll("[data-mode='video']").forEach(function (checkbox) {
            checkbox.checked = true;
          });
          syncModes();
        }
      }

      function savePreset() {
        localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
        setStatus("Preset saved", "Configuration stored locally", "live");
      }

      function loadPreset() {
        var saved = localStorage.getItem(CONFIG_KEY);
        if (!saved) {
          setStatus("No preset", "Nothing saved yet", "idle");
          return;
        }
        try {
          var parsed = JSON.parse(saved);
          config = sanitizeConfig(Object.assign({}, config, parsed));
          syncControlsFromConfig();
          rebuildAllModes();
          syncModes();
          setStatus("Preset loaded", "Configuration restored", "live");
        } catch (error) {
          setStatus("Preset error", "Saved configuration is invalid", "error");
        }
      }

      function downloadPreset() {
        var payload = {
          name: "VJ Cymatics 3D preset",
          exportedAt: new Date().toISOString(),
          config: config
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        var link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "vj-cymatics-3d-preset.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(function () {
          URL.revokeObjectURL(link.href);
        }, 1000);
        setStatus("Preset exported", "JSON download created", "live");
      }

      function sanitizeConfig(next) {
        next.particleCount = clamp(Number(next.particleCount) || 0, 0, 10000);
        next.particleSize = clamp(Number(next.particleSize) || 1, 0.1, 5);
        next.rotationSpeedX = clamp(Number(next.rotationSpeedX) || 0, -1.5, 1.5);
        next.rotationSpeedY = clamp(Number(next.rotationSpeedY) || 0, -1.5, 1.5);
        next.manualRotationX = clamp(Number(next.manualRotationX) || 0, -180, 180);
        next.manualRotationY = clamp(Number(next.manualRotationY) || 0, -180, 180);
        next.glowStrength = clamp(Number(next.glowStrength) || 0, 0, 3);
        next.sparkPower = clamp(Number(next.sparkPower) || 1.3, 0.4, 2.5);
        next.videoWidth = clamp(Number(next.videoWidth) || 320, 120, 480);
        next.videoHeight = Math.round(next.videoWidth * 0.75);
        next.autoRotate = !!next.autoRotate;
        next.enabledModes = Array.isArray(next.enabledModes)
          ? next.enabledModes.filter(function (id) {
            return MODE_IDS.indexOf(id) !== -1;
          })
          : [];
        return next;
      }

      function rebuildAllModes() {
        Object.keys(state.modes).forEach(function (id) {
          rebuildMode(id);
        });
      }

      function updateAudio() {
        if (!state.analyser || !state.frequencyData) {
          var idle = 0.08 + Math.sin(state.clock.elapsedTime * 1.4) * 0.025;
          state.levels.bass = lerp(state.levels.bass, idle, 0.045);
          state.levels.mid = lerp(state.levels.mid, idle * 0.75, 0.045);
          state.levels.treble = lerp(state.levels.treble, idle * 0.55, 0.045);
          state.levels.overall = (state.levels.bass + state.levels.mid + state.levels.treble) / 3;
          return;
        }

        state.analyser.getByteFrequencyData(state.frequencyData);
        state.analyser.getByteTimeDomainData(state.waveformData);
        var bass = averageFrequency(20, 250);
        var mid = averageFrequency(250, 2000);
        var treble = averageFrequency(2000, 8000);
        var overall = (bass * 1.1 + mid + treble * 0.9) / 3;

        state.levels.bass = lerp(state.levels.bass, bass, 0.16);
        state.levels.mid = lerp(state.levels.mid, mid, 0.13);
        state.levels.treble = lerp(state.levels.treble, treble, 0.11);
        state.levels.overall = lerp(state.levels.overall, overall, 0.14);
      }

      function averageFrequency(minHz, maxHz) {
        if (!state.audioContext || !state.frequencyData) {
          return 0;
        }
        var nyquist = state.audioContext.sampleRate / 2;
        var start = Math.max(0, Math.floor(minHz / nyquist * state.frequencyData.length));
        var end = Math.min(state.frequencyData.length - 1, Math.ceil(maxHz / nyquist * state.frequencyData.length));
        if (end <= start) {
          return 0;
        }
        var sum = 0;
        for (var i = start; i <= end; i += 1) {
          sum += state.frequencyData[i];
        }
        var inputBoost = state.audioInputKind === "mic" ? 3.4 : 1;
        return clamp(sum / ((end - start + 1) * 255) * inputBoost, 0, 1);
      }

      function sampleFrequency(normalized) {
        if (!state.frequencyData || state.frequencyData.length === 0) {
          return 0.12 + Math.sin(state.clock.elapsedTime * 2 + normalized * 12) * 0.04;
        }
        var index = clamp(Math.floor(normalized * (state.frequencyData.length - 1)), 0, state.frequencyData.length - 1);
        return state.frequencyData[index] / 255;
      }

      function renderWithGlow(time) {
        var post = state.post;
        if (!post || config.glowStrength <= 0) {
          state.renderer.setRenderTarget(null);
          state.renderer.render(state.scene, state.camera);
          return;
        }

        state.renderer.setRenderTarget(post.sceneTarget);
        state.renderer.clear();
        state.renderer.render(state.scene, state.camera);

        post.quad.material = post.brightMaterial;
        post.brightMaterial.uniforms.tDiffuse.value = post.sceneTarget.texture;
        post.brightMaterial.uniforms.threshold.value = 0.1 + state.levels.overall * 0.06;
        post.brightMaterial.uniforms.intensity.value = 0.95 + state.levels.overall * 1.05;
        state.renderer.setRenderTarget(post.bloomTargetA);
        state.renderer.clear();
        state.renderer.render(post.scene, post.camera);

        post.quad.material = post.blurMaterial;
        var source = post.bloomTargetA;
        var target = post.bloomTargetB;
        for (var i = 0; i < 6; i += 1) {
          post.blurMaterial.uniforms.tDiffuse.value = source.texture;
          post.blurMaterial.uniforms.direction.value.set(i % 2 === 0 ? 1 : 0, i % 2 === 0 ? 0 : 1);
          state.renderer.setRenderTarget(target);
          state.renderer.clear();
          state.renderer.render(post.scene, post.camera);
          var swap = source;
          source = target;
          target = swap;
        }

        post.quad.material = post.finalMaterial;
        post.finalMaterial.uniforms.tScene.value = post.sceneTarget.texture;
        post.finalMaterial.uniforms.tBloom.value = source.texture;
        post.finalMaterial.uniforms.strength.value = config.glowStrength * (0.72 + state.levels.overall * 0.72);
        post.finalMaterial.uniforms.saturation.value = 1.12 + state.levels.treble * 0.28;
        post.finalMaterial.uniforms.time.value = time;
        state.renderer.setRenderTarget(null);
        state.renderer.clear();
        state.renderer.render(post.scene, post.camera);
      }

      function resizeGlowPipeline() {
        if (!state.post) {
          return;
        }
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var width = Math.max(1, Math.floor(window.innerWidth * dpr));
        var height = Math.max(1, Math.floor(window.innerHeight * dpr));
        var bloomWidth = Math.max(1, Math.floor(width * 0.5));
        var bloomHeight = Math.max(1, Math.floor(height * 0.5));
        state.post.sceneTarget.setSize(width, height);
        state.post.bloomTargetA.setSize(bloomWidth, bloomHeight);
        state.post.bloomTargetB.setSize(bloomWidth, bloomHeight);
        state.post.blurMaterial.uniforms.resolution.value.set(bloomWidth, bloomHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        var delta = Math.min(state.clock.getDelta(), 0.045);
        var time = state.clock.elapsedTime;

        updateAudio();
        updateMeters();
        updateRootRotation(delta);
        if (state.atmosphere) {
          state.atmosphere.visible = config.enabledModes.length > 0;
          state.atmosphere.rotation.y += delta * 0.008;
        }

        Object.keys(state.modes).forEach(function (id) {
          var mode = state.modes[id];
          if (config.enabledModes.indexOf(id) === -1) {
            if (mode.object) {
              mode.object.visible = false;
            }
            return;
          }
          if (mode.object) {
            mode.object.visible = true;
          }
          if (mode.update) {
            mode.update(delta, time);
          }
        });

        renderWithGlow(time);
      }

      function updateRootRotation(delta) {
        if (config.autoRotate) {
          state.root.rotation.x += delta * config.rotationSpeedX;
          state.root.rotation.y += delta * config.rotationSpeedY;
        } else {
          state.root.rotation.x = lerp(state.root.rotation.x, state.targetRotation.x, 0.16);
          state.root.rotation.y = lerp(state.root.rotation.y, state.targetRotation.y, 0.16);
        }
      }

      function updateMeters() {
        els.bassMeter.style.width = Math.round(clamp(state.levels.bass, 0, 1) * 100) + "%";
        els.midMeter.style.width = Math.round(clamp(state.levels.mid, 0, 1) * 100) + "%";
        els.trebleMeter.style.width = Math.round(clamp(state.levels.treble, 0, 1) * 100) + "%";
      }

      function resize() {
        state.camera.aspect = window.innerWidth / window.innerHeight;
        state.camera.updateProjectionMatrix();
        state.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        state.renderer.setSize(window.innerWidth, window.innerHeight);
        resizeGlowPipeline();
      }

      function setStatus(title, text, tone) {
        els.statusTitle.textContent = title;
        els.statusText.textContent = text;
        els.statusChip.classList.remove("live", "error");
        if (tone === "live") {
          els.statusChip.classList.add("live");
        }
        if (tone === "error") {
          els.statusChip.classList.add("error");
        }
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - clamp(t, 0, 1), 3);
      }
    }());
  </script>
</body>
</html>
